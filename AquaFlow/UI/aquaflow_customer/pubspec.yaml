name: aquaflow_customer
description: "AquaFlow customer mobile client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^10.3.1
  jwt_decoder: ^2.0.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  image_picker: ^1.2.3
  mime: ^2.0.0
  http_parser: ^4.1.2
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.0
  flutter_stripe: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
